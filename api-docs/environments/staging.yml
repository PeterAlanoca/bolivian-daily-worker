name: Staging
variables:
  - name: openRouterBaseUrl
    value: https://openrouter.ai/api/v1
    enabled: true
    secret: false
    description: OpenRouter base URL (SaaS, same across all environments)
  - name: openRouterApiKey
    value: '{{process.env.OPENROUTER_API_KEY}}'
    enabled: true
    secret: false
    description: OpenRouter API key (resolved from .env, gitignored)
  - name: apiBaseUrl
    value: https://api.staging.example.com
    enabled: true
    secret: false
    description: BolivianDaily API base URL (staging, dummy)
  - name: loginUsername
    value: peter
    enabled: true
    secret: false
    description: Login username (dummy)
  - name: loginPassword
    value: '123456'
    enabled: true
    secret: false
    description: Login password (dummy)
  - name: accessToken
    value: ''
    enabled: true
    secret: false
    description: Access JWT; populated automatically when Login runs
  - name: refreshToken
    value: ''
    enabled: true
    secret: false
    description: Refresh JWT; populated automatically when Login runs
