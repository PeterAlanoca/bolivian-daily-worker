info:
  name: Publish ArticleScrapedEvent
  type: http
  seq: 1

http:
  method: POST
  url: "{{rabbitmqBaseUrl}}/api/exchanges/%2F/bolivian-daily.articles/publish"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "properties": {
          "content_type": "application/json",
          "delivery_mode": 2,
          "type": "ArticleScrapedEvent"
        },
        "routing_key": "article.scraped",
        "payload": "{\"articleId\":999999,\"sourceId\":1,\"sourceName\":\"Jornada\",\"sourceUrl\":\"https://jornada.com.bo/\",\"url\":\"https://jornada.com.bo/paz-recorta-su-gabinete-a-12-ministerios-para-eliminar-la-burocracia/\",\"categoryId\":1,\"categoryName\":\"NACIONAL\",\"pretitle\":null,\"title\":\"Paz recorta su gabinete a 12 ministerios para eliminar la «burocracia»\",\"subtitle\":null,\"lead\":\"El presidente Rodrigo Paz anunció este lunes la reducción de sus ministerios, de catorce a doce, tras la eliminación de las carteras de Planificación del Desarrollo y de Turismo Sostenible, Cultura, Folclore y Gastronomía, para tener un Estado más «eficiente» y acabar con la «burocracia».\",\"rawBody\":\"<p class=\\\"wp-block-paragraph\\\">El mandatario hizo el anuncio tras tomar juramento a los nuevos ministros de Relaciones Exteriores, Héctor Huanca, y de la Presidencia, Fernando Aramayo, además de anunciar que el hasta ahora titular en esa última cartera de Estado, José Luis Lupo, fue propuesto como nuevo embajador de Bolivia ante la Organización de Estados Americanos (OEA).</p>\\n<p class=\\\"wp-block-paragraph\\\">«Recibimos un Gobierno que venía con 21 ministerios (…) Nosotros generamos otra instancia de catorce ministerios y hoy día, reduciendo la burocracia estamos pasando a doce ministerios. O sea que el Gobierno central está dando señales claras de buscar un Estado no ausente, sino presente, eficiente», sostuvo.</p>\\n<p class=\\\"wp-block-paragraph\\\">El gobernante explicó que una parte del Ministerio de Turismo Sostenible, Cultura, Folclore y Gastronomía quedará dentro del Ejecutivo, pero que se creará una «agencia nacional» que permitirá «darle agilidad» al encuentro entre «lo público y privado» y «lo nacional e internacional» para generar un impacto en la economía nacional desde esos sectores.</p>\\n<p class=\\\"wp-block-paragraph\\\">También señaló que el Ministerio de Planificación del Desarrollo será eliminado, que algunas de sus atribuciones que son «necesarias» pasarán a otras instituciones y que el actual titular de esa cartera de Estado, José Fernando Romero, continuará en el Gobierno «con una nueva misión que se le encomendará más adelante».</p>\\n<p class=\\\"wp-block-paragraph\\\">Paz destacó que Romero «tuvo una labor extraordinaria para ir generando menos burocracia y mayor eficiencia en la capacidad de atención de los ciudadanos».</p>\\n<p class=\\\"wp-block-paragraph\\\">El mandatario, que este 8 de agosto cumplirá nueve meses de Gobierno, aseguró que estos ajustes marcan la conclusión de un «tiempo de transición» y el inicio de las «transformaciones profundas».</p>\\n<p class=\\\"wp-block-paragraph\\\">Además, recordó que durante la campaña electoral, prometió primero «ordenar la casa» para trabajar posteriormente con «instituciones bilaterales o multilaterales» y ratificó que ese «ordenamiento» pasa ahora «a un punto de partida de las transformaciones» que busca hacer su Gobierno.</p>\\n<p class=\\\"wp-block-paragraph\\\">Estos ajustes en la estructura estatal fueron anunciados casi una semana después de que se conociera que se alcanzó un acuerdo con el Fondo Monetario Internacional (FMI) para un programa técnico por 1.900 millones de dólares que apoyarán las reformas puestas en marcha por el Gobierno boliviano para estabilizar la economía, que está en crisis.</p>\\n<p class=\\\"wp-block-paragraph\\\">Entre las acciones comprometidas para el acuerdo están continuar con la «racionalización» del gasto público, la reducción gradual del déficit fiscal y preservar el «financiamiento monetario cero» del mismo, y el impulso de reformas para mejorar el clima de negocios y para un crecimiento económico con protección social, según ha informado el FMI.</p>\\n<p class=\\\"wp-block-paragraph\\\">Los ajustes también ocurren después de que el domingo, el empresario y excandidato presidencial Samuel Doria Medina anunció el retiro de su apoyo al Gobierno, alegando que le «preocupa la corrupción» y la falta de un cambio «integral» en algunas áreas del Estado.</p>\",\"author\":\"JORNADA\",\"publishedAt\":\"2026-08-04T02:29:49Z\",\"media\":[],\"scrapedAt\":\"2026-08-09T15:03:46.848Z\"}",
        "payload_encoding": "string"
      }
  auth:
    type: basic
    username: guest
    password: guest

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Publica un ArticleScrapedEvent directamente al exchange `bolivian-daily.articles`
  (routing key `article.scraped` → cola `checker.article-scraped`), sin depender del ScraperWorker.

  - Auth: Basic `guest`/`guest` (Management API de RabbitMQ).
  - URL usa la variable `{{rabbitmqBaseUrl}}` (definida en los entornos local/staging/production).
  - Para que Bruno resuelva la variable: seleccionar el entorno (p.ej. "Local") en el selector
    y, si la variable es nueva, reabrir la coleccion para que la cargue.
  - Respuesta esperada: `{"routed":true}` → el mensaje llego a la cola del checker.
  - `articleId` DEBE ser unico por prueba (indice unico en `checked_articles.scraped_article_id`;
    si se repite, el consumer lo ignora por dedupe).
  - Las fechas (`publishedAt`, `scrapedAt`) DEBEN ir en UTC con `Z` (mismo formato que publica el
    scraper real). Con offset (p.ej. `-04:00`) System.Text.Json las deserializa como `DateTime` con
    Kind=Local y Npgsql falla: `Cannot write DateTime with Kind=Local to 'timestamp with time zone'`.
  - Datos reales: fila `articles` id 9 de scraper_db (Jornada, NACIONAL, publicada 2026-08-03).
  - `media` vacio: la fuente no envio multimedia en este ejemplo.
  - Sin `OPENROUTER_API_KEY`, el checker fallara la validacion y el mensaje ira a la DLQ
    (`checker.article-scraped.dead`) tras `MaxRetries` reintentos.
