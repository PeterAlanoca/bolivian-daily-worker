info:
  name: Register News Article
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiBaseUrl}}/api/articles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "New public transport system in La Paz",
        "summary": "A new digital platform will be implemented",
        "content": "The project will improve tracking of transport units.",
        "image_url": "https://example.com/news/image.jpg",
        "category": "Tecnologia",
        "published_date": "2026-08-06T20:30:00Z"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST `{{apiBaseUrl}}/api/news/articles` (requires Bearer Token)

  Registers a news article. Authentication: `Authorization: Bearer <access_token>`.
  Run `Login` first: its after-response script populates `{{accessToken}}`
  (equivalent to the `$ACCESS_TOKEN` variable example).

  Body fields:
  - `title`: article title
  - `summary`: short summary
  - `content`: full content
  - `image_url`: main image URL (optional)
  - `category`: category (Tecnologia, General, ...)
  - `published_date`: publication date ISO 8601

  Expected response: 201 Created with the created article.
