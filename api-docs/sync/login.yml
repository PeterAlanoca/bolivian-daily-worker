info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: '{{apiBaseUrl}}/api/auth/login'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{loginUsername}}",
        "password": "{{loginPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.access_token) {
          bru.setVar("accessToken", res.body.access_token);
          bru.setVar("refreshToken", res.body.refresh_token);
        }

docs: |-
  POST `{{apiBaseUrl}}/api/auth/login`

  Authenticates against the BolivianDaily API. Returns the JWT pair:
  - `access_token`: Bearer token to call `/api/news/articles`
  - `refresh_token`: to renew the access token

  Expected response (200 OK):

  ```json
  {
    "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6...",
    "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6...",
    "token_type": "Bearer",
    "expires_in": 3600
  }
  ```

  The after-response script stores both tokens in runtime variables
  (`accessToken` / `refreshToken`), which have the highest precedence and are
  reused by subsequent requests (equivalent to the `$ACCESS_TOKEN` example).
